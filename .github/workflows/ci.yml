name: CI（构建与测试）

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: 单元测试 + 编译检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5

      # 保险：即使仓库里 gradlew 的可执行位丢了也能跑
      - name: 确保 gradlew 可执行
        run: chmod +x ./gradlew

      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon
