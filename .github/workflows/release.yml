name: Build & Release APK

# 手动触发：仓库页面 Actions -> Build & Release APK -> Run workflow
on:
  workflow_dispatch:
    inputs:
      release_name:
        description: '自定义 Release 标题（留空则自动使用 v<版本号>）'
        required: false
        default: ''
      prerelease:
        description: '是否为预发布（prerelease）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: 构建 APK 并发布 Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 缓存 Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: android-sdk-${{ runner.os }}-

      - name: 读取版本号（唯一来源 gradle/libs.versions.toml）
        id: version
        run: |
          VERSION_NAME=$(grep -E '^\s*appVersionName\s*=' gradle/libs.versions.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^\s*appVersionCode\s*=' gradle/libs.versions.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=ModelScout-Mobile-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "检测到版本：$VERSION_NAME ($VERSION_CODE)"

      - name: 跑单元测试
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 重命名 APK（按版本号）
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/${{ steps.version.outputs.APK_NAME }}"

      - name: 生成带版本号的 tag 说明
        run: |
          echo "release notes for ${{ steps.version.outputs.tag }}" > /dev/null

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('ModelScout Mobile {0}', steps.version.outputs.tag) }}
          files: release-artifacts/${{ steps.version.outputs.APK_NAME }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true

      - name: 上传构建产物（工作流页面可下载，7 天）
        uses: actions/upload-artifact@v4
        with:
          name: ModelScout-Mobile-${{ steps.version.outputs.name }}-apk
          path: release-artifacts/${{ steps.version.outputs.APK_NAME }}
          retention-days: 7
