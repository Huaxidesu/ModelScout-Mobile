name: Build & Release APK

# 手动触发：仓库页面 Actions -> Build & Release APK -> Run workflow
on:
  workflow_dispatch:
    inputs:
      release_name:
        description: '自定义 Release 标题（留空则自动使用 v<版本号>）'
        required: false
        default: ''
      prerelease:
        description: '是否为预发布（prerelease）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: 构建 APK 并发布 Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      # runner 自带的 Android SDK 已含 platform 35 / build-tools，无需手动下载，
      # 只需固定一份 platform-tools 与 licenses，避免每次冷启动。
      - name: 准备 Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed 2>/dev/null | head -20 || true

      - name: 读取版本号（唯一来源 gradle/libs.versions.toml）
        id: version
        run: |
          VERSION_NAME=$(grep -E '^[[:space:]]*appVersionName[[:space:]]*=' gradle/libs.versions.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E '^[[:space:]]*appVersionCode[[:space:]]*=' gradle/libs.versions.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=ModelScout-Mobile-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "检测到版本：$VERSION_NAME ($VERSION_CODE)"

      # 保险：即使仓库里 gradlew 的可执行位丢了也能跑
      - name: 确保 gradlew 可执行
        run: chmod +x ./gradlew

      - name: 跑单元测试
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 重命名 APK（按版本号）
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/${{ steps.version.outputs.APK_NAME }}"
          ls -lh release-artifacts/

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('ModelScout Mobile {0}', steps.version.outputs.tag) }}
          files: release-artifacts/${{ steps.version.outputs.APK_NAME }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true

      - name: 上传构建产物（工作流页面可下载，7 天）
        uses: actions/upload-artifact@v4
        with:
          name: ModelScout-Mobile-${{ steps.version.outputs.name }}-apk
          path: release-artifacts/${{ steps.version.outputs.APK_NAME }}
          retention-days: 7
